[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ipad-bridge"
dynamic = ["version"]
description = "Use a Windows PC's built-in Bluetooth as a keyboard + mouse for an iPad: push the cursor past the screen edge to control the iPad."
readme = "README_EN.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "February22" }]
keywords = ["ipad", "bluetooth", "ble", "hid", "hogp", "keyboard", "mouse", "kvm", "universal-control", "windows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
    "Topic :: Utilities",
]
dependencies = [
    "winrt-runtime>=3.2",
    "winrt-Windows.Foundation>=3.2",
    "winrt-Windows.Foundation.Collections>=3.2",
    "winrt-Windows.Devices.Bluetooth>=3.2",
    "winrt-Windows.Devices.Bluetooth.GenericAttributeProfile>=3.2",
    "winrt-Windows.Devices.Enumeration>=3.2",
    "winrt-Windows.Devices.Radios>=3.2",
    "winrt-Windows.Storage.Streams>=3.2",
    "pystray>=0.19",
    "Pillow>=10",
]

[project.urls]
Homepage = "https://github.com/a1103688841/ipad-bridge"
Issues = "https://github.com/a1103688841/ipad-bridge/issues"

[project.scripts]
ipad-bridge = "ipad_bridge.__main__:main"

[project.gui-scripts]
ipad-bridge-tray = "ipad_bridge.__main__:main"

[tool.setuptools]
packages = ["ipad_bridge"]

[tool.setuptools.dynamic]
version = { attr = "ipad_bridge.__version__" }
